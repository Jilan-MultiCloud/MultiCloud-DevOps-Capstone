# Run from the repo root:
#   mkdir -p monitoring/secrets
#   echo "https://hooks.slack.com/services/XXX" > monitoring/secrets/slack_webhook_url
#   echo "<pagerduty-events-v2-routing-key>"      > monitoring/secrets/pagerduty_routing_key
#   docker compose -f monitoring/docker-compose.yml up -d
# Prometheus :9090  Alertmanager :9093  Grafana :3000 (admin / see GF_SECURITY_ADMIN_PASSWORD)
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [blackbox, alertmanager]

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets:/etc/alertmanager/secrets:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
