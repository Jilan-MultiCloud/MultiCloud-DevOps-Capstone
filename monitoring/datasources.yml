# ==============================================================================
# GRAFANA AUTOMATED DATA PROVISIONING ENGINE
# ==============================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Updated to 'prometheus:9090' to ensure Grafana can reach Prometheus when both run in Docker Compose.
    url: http://prometheus:9090
    isDefault: true
    editable: false