# ==============================================================================
# ALERT RULES (probe metrics come from the Blackbox Exporter)
# ==============================================================================
groups:
  - name: MultiCloudAppAlerts
    rules:
      - alert: MultiCloudEndpointDown
        expr: probe_success{job=~"endpoint-probe.*"} == 0
        for: 1m
        labels:
          severity: critical
          tier: infrastructure
        annotations:
          summary: "{{ $labels.cloud }} endpoint is down"
          description: "Health probe for {{ $labels.instance }} ({{ $labels.cloud }}) has failed for over 1 minute."

      - alert: RouterOffline
        expr: probe_success{job="router-probe"} == 0
        for: 1m
        labels:
          severity: critical
          tier: application
        annotations:
          summary: "Python request router is offline"
          description: "The multi-cloud router is down, so failover testing and routed traffic are unavailable."

      - alert: EndpointHighLatency
        expr: probe_duration_seconds{job=~"endpoint-probe.*"} > 2
        for: 2m
        labels:
          severity: warning
          tier: performance
        annotations:
          summary: "High latency on {{ $labels.cloud }}"
          description: "{{ $labels.instance }} has taken longer than 2 seconds to respond for 2 minutes."

      - alert: AllCloudsDown
        expr: sum(probe_success{job=~"endpoint-probe.*"}) == 0
        for: 1m
        labels:
          severity: critical
          tier: infrastructure
        annotations:
          summary: "All cloud endpoints are down"
          description: "No AWS, Azure or GCP endpoint is passing health probes."

      # Cost control: unexpected spikes in blackbox probe volume are not a cost
      # signal by themselves; cloud spend alerts are configured through the
      # provider budgets (see docs/cost_optimization.md).
