# ==============================================================================
# ALERTMANAGER: Slack + PagerDuty
# Secrets are NOT stored here. docker-compose mounts them from files under
# monitoring/secrets/ (git-ignored): slack_webhook_url, pagerduty_routing_key.
# ==============================================================================
route:
  receiver: slack
  group_by: ["alertname", "cloud"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: pagerduty
      continue: true   # critical alerts go to PagerDuty AND Slack

receivers:
  - name: slack
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        channel: "#multicloud-alerts"
        send_resolved: true
        title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"

  - name: pagerduty
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty_routing_key
        send_resolved: true
