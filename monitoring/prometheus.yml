global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: capstone
    scrape_timeout: 20s
    static_configs:
      - targets: [exporter:9108]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
