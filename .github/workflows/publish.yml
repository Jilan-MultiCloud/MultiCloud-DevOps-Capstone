name: Publish immutable application artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: dev-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and publish the same container to both registries
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
          GAR_HOST: ${{ vars.GAR_HOST }}
        run: |
          test -n "$ACR_NAME" && test -n "$GAR_REPOSITORY" && test -n "$GAR_HOST"
          az acr login --name "$ACR_NAME"
          gcloud auth configure-docker "$GAR_HOST" --quiet
          docker build -t "${ACR_NAME}.azurecr.io/multicloud-capstone:${GITHUB_SHA}" app
          docker tag "${ACR_NAME}.azurecr.io/multicloud-capstone:${GITHUB_SHA}" "${GAR_REPOSITORY}/multicloud-capstone:${GITHUB_SHA}"
          docker push "${ACR_NAME}.azurecr.io/multicloud-capstone:${GITHUB_SHA}"
          docker push "${GAR_REPOSITORY}/multicloud-capstone:${GITHUB_SHA}"
          docker inspect --format='{{json .RepoDigests}}' "${ACR_NAME}.azurecr.io/multicloud-capstone:${GITHUB_SHA}" > release-images.json
      - name: Package Lambda separately at ZIP root
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('lambda_function.zip', 'w') as archive:
              archive.write('app/lambda_function.py', 'lambda_function.py')
              archive.write('app/runtime_metrics.py', 'runtime_metrics.py')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: application-release
          path: |
            release-images.json
            lambda_function.zip
          retention-days: 7
