name: Capstone checks
on:
  push:
    branches: [main, 'capstone/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform/environments/dev init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=terraform/environments/dev validate
      - run: terraform -chdir=terraform/environments/dev test -test-directory=tests
      - run: docker build -t capstone-check app
      - name: Validate monitoring configuration and alerts
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.2.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.2.1 test rules /etc/prometheus/alert-tests.yml
          mkdir -p monitoring/data
          printf 'https://hooks.slack.com/services/test/test/test' > monitoring/data/slack-webhook
          docker run --rm --entrypoint amtool -v "$PWD/monitoring/alertmanager.yml:/etc/alertmanager/config.yml:ro" -v "$PWD/monitoring/data/slack-webhook:/run/secrets/slack-webhook:ro" prom/alertmanager:v0.28.1 check-config /etc/alertmanager/config.yml
