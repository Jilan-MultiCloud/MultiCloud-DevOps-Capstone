name: Multi-Cloud CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - "app/**"
      - ".github/workflows/terraform-ci-cd.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Check HCL Code Formatting
        run: terraform fmt -check -recursive ../../modules/

      - name: Initialize Provider Locks Without Remote State
        run: terraform init -backend=false -input=false

      - name: Validate Structural Configurations
        run: terraform validate

  build-and-push-artifacts:
    runs-on: ubuntu-latest
    needs: validate-infra
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- 1. AWS ECR PUSH & PUBLIC GALLERY AUTHENTICATION (ap-south-1 Mumbai) ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR Public (For pulling base image)
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Login to Amazon ECR Private (For pushing final image)
        id: login-ecr-private
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: private

      - name: Build and Push to AWS ECR
        uses: docker/build-push-action@v5
        env:
          ECR_REGISTRY: 319918321628.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: multicloud-capstone
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # --- 2. GCP ARTIFACT REGISTRY PUSH (asia-south1 Mumbai) ---
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_MY_ORG_SA_KEY }}

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build and Push to GCP
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            asia-south1-docker.pkg.dev/${{ secrets.GCP_MY_ORG_PROJECT_ID }}/cloud-run-source-deploy/multicloud-capstone:latest
            asia-south1-docker.pkg.dev/${{ secrets.GCP_MY_ORG_PROJECT_ID }}/cloud-run-source-deploy/multicloud-capstone:${{ github.sha }}

      # --- 3. AZURE ACR PUSH ---
      - name: Authenticate to Azure ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build and Push to Azure
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/multicloud-capstone:latest
            ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/multicloud-capstone:${{ github.sha }}

  deploy-infra:
    runs-on: ubuntu-latest
    needs: build-and-push-artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: terraform/environments/dev
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "ap-south-1"
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_MY_ORG_SA_KEY }}
      TF_VAR_gcp_project_id: ${{ secrets.GCP_MY_ORG_PROJECT_ID }}
      TF_VAR_gcp_bucket_name: "multicloud-capstone-storage-jilan-2026"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan