name: Multi-Cloud CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - "app/**"
      - ".github/workflows/terraform-ci-cd.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # STEP 1: Code Verification & Architecture Linting
  validate-infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Check HCL Code Formatting
        run: terraform fmt -check -recursive ../../modules/

      - name: Initialize Provider Locks Without Remote State
        run: terraform init -backend=false

      - name: Validate Structural Configurations
        run: terraform validate

  # STEP 2: Multi-Cloud Docker Build & Registry Push
  build-and-push-artifacts:
    runs-on: ubuntu-latest
    needs: validate-infra
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- GLOBAL BUILDX SETUP FOR LAYER CACHING ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- 1. AWS ECR PUSH & CACHE CREATION ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        # Removed public flag to correctly log into and target your private account registry URI

      - name: Build and Push to AWS ECR (Writes Cache)
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/multicloud-capstone:latest
            ${{ steps.login-ecr.outputs.registry }}/multicloud-capstone:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 2. GCP ARTIFACT REGISTRY PUSH (Reuses Cache) ---
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build and Push to GCP (Instant Cache Hit)
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/multicloud-capstone:latest
            asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/multicloud-capstone:${{ github.sha }}
          cache-from: type=gha

      # --- 3. AZURE ACR PUSH (Reuses Cache) ---
      - name: Authenticate to Azure ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build and Push to Azure (Instant Cache Hit)
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/multicloud-capstone:latest
            ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/multicloud-capstone:${{ github.sha }}
          cache-from: type=gha

  # STEP 3: Multi-Cloud Infrastructure Deployment
  deploy-infra:
    runs-on: ubuntu-latest
    needs: build-and-push-artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: terraform/environments/dev
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-east-1"
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
