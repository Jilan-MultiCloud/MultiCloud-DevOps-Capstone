name: Multi-Cloud CI/CD Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - "app/**"
      - ".github/workflows/terraform-ci-cd.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Check HCL Code Formatting
        run: terraform fmt -check -recursive ../../modules/

      - name: Initialize Provider Locks Without Remote State
        run: terraform init -backend=false -input=false

      - name: Validate Structural Configurations
        run: terraform validate

  build-and-push-artifacts:
    runs-on: ubuntu-latest
    needs: validate-infra
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- 1. AWS ECR LOGIN ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR Private
        id: login-ecr-private
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: private

      # --- 2. GOOGLE CLOUD LOGIN ---
      - name: Authenticate to Google Cloud
        id: auth-gcp
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_MY_ORG_SA_KEY }}
          token_format: 'access_token'

      - name: Login to GCP Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: asia-south1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth-gcp.outputs.access_token }}

      # --- 3. AZURE ACR LOGIN ---
      - name: Authenticate to Azure ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      # --- 4. BUILD ONCE, THEN PUSH TO ALL REGISTRIES ---
      - name: Build Docker image once
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          load: true
          tags: |
            multicloud-capstone:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push image to AWS ECR
        run: |
          docker tag multicloud-capstone:ci ${{ steps.login-ecr-private.outputs.registry }}/multicloud-capstone:latest
          docker tag multicloud-capstone:ci ${{ steps.login-ecr-private.outputs.registry }}/multicloud-capstone:${{ github.sha }}
          docker push ${{ steps.login-ecr-private.outputs.registry }}/multicloud-capstone:latest
          docker push ${{ steps.login-ecr-private.outputs.registry }}/multicloud-capstone:${{ github.sha }}

      - name: Push image to GCP Artifact Registry
        run: |
          docker tag multicloud-capstone:ci asia-south1-docker.pkg.dev/${{ secrets.GCP_MY_ORG_PROJECT_ID }}/cloud-run-source-deploy/multicloud-capstone:latest
          docker tag multicloud-capstone:ci asia-south1-docker.pkg.dev/${{ secrets.GCP_MY_ORG_PROJECT_ID }}/cloud-run-source-deploy/multicloud-capstone:${{ github.sha }}
          docker push asia-south1-docker.pkg.dev/${{ secrets.GCP_MY_ORG_PROJECT_ID }}/cloud-run-source-deploy/multicloud-capstone:latest
          docker push asia-south1-docker.pkg.dev/${{ secrets.GCP_MY_ORG_PROJECT_ID }}/cloud-run-source-deploy/multicloud-capstone:${{ github.sha }}

      - name: Push image to Azure ACR
        run: |
          docker tag multicloud-capstone:ci ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/multicloud-capstone:latest
          docker tag multicloud-capstone:ci ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/multicloud-capstone:${{ github.sha }}
          docker push ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/multicloud-capstone:latest
          docker push ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/multicloud-capstone:${{ github.sha }}

  deploy-infra:
    runs-on: ubuntu-latest
    needs: build-and-push-artifacts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: terraform/environments/dev
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "ap-south-1"
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_MY_ORG_SA_KEY }}
      TF_VAR_gcp_project_id: ${{ secrets.GCP_MY_ORG_PROJECT_ID }}
      TF_VAR_gcp_bucket_name: "multicloud-capstone-storage-jilan-2026"
      TF_VAR_azure_resource_group_name: "rg-multicloud-centralindia"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false tfplan