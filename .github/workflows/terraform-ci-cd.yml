name: Multi-Cloud CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - "app/**"
      - ".github/workflows/terraform-ci-cd.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # STEP 1: Code Verification & Architecture Linting
  validate-infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Check HCL Code Formatting
        run: terraform fmt -check -recursive ../../modules/

      - name: Initialize Provider Locks Without Remote State
        run: terraform init -backend=false

      - name: Validate Structural Configurations
        run: terraform validate

  # STEP 2: Build Artifact Delivery (Runs after successful verification on Push)
  build-and-push-artifacts:
    runs-on: ubuntu-latest
    needs: validate-infra
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- Package AWS Serverless Artifact ---
      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Package AWS Lambda Payload
        run: |
          cd app
          zip -r ../lambda_function.zip lambda_function.py
          cd ..

      # --- Package Containerized Artifact ---
      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compile and Push Microservice Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            jbshk/multicloud-capstone:latest
            jbshk/multicloud-capstone:${{ github.sha }}
