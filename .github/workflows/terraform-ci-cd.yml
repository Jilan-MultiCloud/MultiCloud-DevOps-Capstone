name: Reviewed Terraform deployment
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply after review in the protected dev-apply environment
        type: boolean
        default: false
      azure_image:
        description: Optional immutable ACR image reference
        type: string
      gcp_image:
        description: Optional immutable Artifact Registry image reference
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: capstone-dev-infrastructure
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  ARM_USE_OIDC: 'true'
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  STATE_REGION: ${{ vars.TF_STATE_REGION }}
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    environment: dev-plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.TF_STATE_REGION }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Initialize existing remote state
        run: |
          test -n "$STATE_BUCKET" && test -n "$STATE_REGION"
          aws s3api head-object --bucket "$STATE_BUCKET" --key capstone/dev.tfstate > /dev/null
          terraform -chdir=terraform/environments/dev init -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$STATE_REGION" -backend-config="key=capstone/dev.tfstate" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Set environment configuration and release images
        env:
          TF_CONFIG_JSON: ${{ vars.TF_CONFIG_JSON }}
          AZURE_IMAGE: ${{ inputs.azure_image }}
          GCP_IMAGE: ${{ inputs.gcp_image }}
        run: python scripts/ci_config.py
      - run: terraform -chdir=terraform/environments/dev plan -out=review.tfplan
      - name: Store plan and exact Lambda ZIP privately
        run: |
          aws s3 cp terraform/environments/dev/review.tfplan "s3://$STATE_BUCKET/plans/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/review.tfplan" --sse AES256
          aws s3 cp terraform/environments/dev/lambda_function.zip "s3://$STATE_BUCKET/plans/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/lambda_function.zip" --sse AES256
          echo 'Review the plan log before approving dev-apply. Plan bytes are stored in the private state bucket.' >> "$GITHUB_STEP_SUMMARY"
  apply:
    needs: plan
    if: inputs.apply && github.ref == 'refs/heads/main'
    environment: dev-apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.TF_STATE_REGION }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Initialize existing remote state
        run: |
          test -n "$STATE_BUCKET" && test -n "$STATE_REGION"
          aws s3api head-object --bucket "$STATE_BUCKET" --key capstone/dev.tfstate > /dev/null
          terraform -chdir=terraform/environments/dev init -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$STATE_REGION" -backend-config="key=capstone/dev.tfstate" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Retrieve the saved plan and deployment package
        run: |
          aws s3 cp "s3://$STATE_BUCKET/plans/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/review.tfplan" terraform/environments/dev/review.tfplan
          aws s3 cp "s3://$STATE_BUCKET/plans/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/lambda_function.zip" terraform/environments/dev/lambda_function.zip
      - run: terraform -chdir=terraform/environments/dev apply review.tfplan
