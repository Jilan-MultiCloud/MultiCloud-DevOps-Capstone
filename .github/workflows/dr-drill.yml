name: Local PostgreSQL recovery evidence
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['scripts/backup_restore.py', 'scripts/dr_drill.py', '.github/workflows/dr-drill.yml']
permissions:
  contents: read
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.dr_drill --output evidence/local-postgres-drill.json
      - uses: actions/upload-artifact@v4
        with:
          name: local-drill-evidence
          path: evidence/local-postgres-drill.json
          retention-days: 7
